<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Information Form</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-slate-100 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto">


        <!-- ================================================= -->
        <!-- MAIN FORM CONTAINER -->
        <!-- ================================================= -->

        <div class="bg-white rounded-2xl shadow-xl p-4 md:p-10">


            <!-- HEADING -->

            <div class="text-center mb-8">

                <h1 class="text-3xl md:text-4xl font-bold text-slate-800">

                    Personal Information Form

                </h1>

                <p class="text-slate-500 mt-2">

                    Please enter your personal information

                </p>

            </div>



            <!-- ================================================= -->
            <!-- FORM -->
            <!-- ================================================= -->

            <form id="personalForm">


                <!-- FULL NAME -->

                <div class="mb-5">

                    <label
                        for="fullName"
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Full Name

                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                    <p
                        id="fullNameError"
                        class="text-red-500 text-sm mt-1">
                    </p>

                </div>



                <!-- FATHER NAME -->

                <div class="mb-5">

                    <label
                        for="fatherName"
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Father Name

                    </label>

                    <input
                        type="text"
                        id="fatherName"
                        placeholder="Enter father name"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                    <p
                        id="fatherNameError"
                        class="text-red-500 text-sm mt-1">
                    </p>

                </div>



                <!-- EMAIL + PHONE -->

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                    <!-- EMAIL -->

                    <div class="mb-5">

                        <label
                            for="email"
                            class="block text-sm font-semibold text-slate-700 mb-2">

                            Email

                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="example@gmail.com"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                        <p
                            id="emailError"
                            class="text-red-500 text-sm mt-1">
                        </p>

                    </div>


                    <!-- PHONE -->

                    <div class="mb-5">

                        <label
                            for="phone"
                            class="block text-sm font-semibold text-slate-700 mb-2">

                            Phone Number

                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="03XX-XXXXXXX"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                        <p
                            id="phoneError"
                            class="text-red-500 text-sm mt-1">
                        </p>

                    </div>

                </div>



                <!-- DATE + CITY -->

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">


                    <!-- DATE OF BIRTH -->

                    <div class="mb-5">

                        <label
                            for="dob"
                            class="block text-sm font-semibold text-slate-700 mb-2">

                            Date of Birth

                        </label>

                        <input
                            type="date"
                            id="dob"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                        <p
                            id="dobError"
                            class="text-red-500 text-sm mt-1">
                        </p>

                    </div>


                    <!-- CITY -->

                    <div class="mb-5">

                        <label
                            for="city"
                            class="block text-sm font-semibold text-slate-700 mb-2">

                            City

                        </label>

                        <select
                            id="city"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                            <option value="">
                                Select City
                            </option>

                            <option value="Bahawalpur">
                                Bahawalpur
                            </option>

                            <option value="Bahawalnagar">
                                Bahawalnagar
                            </option>

                            <option value="Lahore">
                                Lahore
                            </option>

                            <option value="Karachi">
                                Karachi
                            </option>

                            <option value="Islamabad">
                                Islamabad
                            </option>

                        </select>

                        <p
                            id="cityError"
                            class="text-red-500 text-sm mt-1">
                        </p>

                    </div>

                </div>



                <!-- GENDER -->

                <div class="mb-5">

                    <label
                        class="block text-sm font-semibold text-slate-700 mb-3">

                        Gender

                    </label>

                    <div class="flex gap-6">

                        <label class="flex items-center gap-2">

                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                                class="w-4 h-4">

                            <span>Male</span>

                        </label>


                        <label class="flex items-center gap-2">

                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                                class="w-4 h-4">

                            <span>Female</span>

                        </label>

                    </div>

                    <p
                        id="genderError"
                        class="text-red-500 text-sm mt-1">
                    </p>

                </div>



                <!-- SKILLS -->

                <div class="mb-5">

                    <label
                        class="block text-sm font-semibold text-slate-700 mb-3">

                        Skills

                    </label>

                    <div class="flex flex-wrap gap-5">

                        <label class="flex items-center gap-2">

                            <input
                                type="checkbox"
                                name="skills"
                                value="HTML"
                                class="w-4 h-4">

                            <span>HTML</span>

                        </label>


                        <label class="flex items-center gap-2">

                            <input
                                type="checkbox"
                                name="skills"
                                value="CSS"
                                class="w-4 h-4">

                            <span>CSS</span>

                        </label>


                        <label class="flex items-center gap-2">

                            <input
                                type="checkbox"
                                name="skills"
                                value="JavaScript"
                                class="w-4 h-4">

                            <span>JavaScript</span>

                        </label>


                        <label class="flex items-center gap-2">

                            <input
                                type="checkbox"
                                name="skills"
                                value="React"
                                class="w-4 h-4">

                            <span>React</span>

                        </label>

                    </div>

                    <p
                        id="skillsError"
                        class="text-red-500 text-sm mt-1">
                    </p>

                </div>



                <!-- QUALIFICATION -->

                <div class="mb-5">

                    <label
                        for="qualification"
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Qualification

                    </label>

                    <select
                        id="qualification"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

                        <option value="">
                            Select Qualification
                        </option>

                        <option value="Matric">
                            Matric
                        </option>

                        <option value="Intermediate">
                            Intermediate
                        </option>

                        <option value="Bachelor">
                            Bachelor
                        </option>

                        <option value="Master">
                            Master
                        </option>

                        <option value="PhD">
                            PhD
                        </option>

                    </select>

                    <p
                        id="qualificationError"
                        class="text-red-500 text-sm mt-1">
                    </p>

                </div>



                <!-- ADDRESS -->

                <div class="mb-5">

                    <label
                        for="address"
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Address

                    </label>

                    <textarea
                        id="address"
                        rows="3"
                        placeholder="Enter your complete address"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>

                    <p
                        id="addressError"
                        class="text-red-500 text-sm mt-1">
                    </p>

                </div>



                <!-- ABOUT -->

                <div class="mb-5">

                    <label
                        for="about"
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        About Yourself

                    </label>

                    <textarea
                        id="about"
                        rows="4"
                        placeholder="Write something about yourself"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>

                    <p
                        id="aboutError"
                        class="text-red-500 text-sm mt-1">
                    </p>

                </div>



                <!-- PROFILE PICTURE -->

                <div class="mb-6">

                    <label
                        for="profile"
                        class="block text-sm font-semibold text-slate-700 mb-2">

                        Profile Picture

                    </label>

                    <input
                        type="file"
                        id="profile"
                        accept="image/*"
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg bg-white">

                </div>



                <!-- SUCCESS MESSAGE -->

                <p
                    id="successMessage"
                    class="text-green-600 font-semibold mb-4">
                </p>



                <!-- BUTTONS -->

                <div class="flex flex-col sm:flex-row gap-3">

                    <button
                        type="submit"
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-5 rounded-lg transition">

                        Submit Form

                    </button>


                    <button
                        type="reset"
                        class="sm:w-32 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 px-5 rounded-lg transition">

                        Reset

                    </button>

                </div>

            </form>

        </div>



        <!-- ================================================= -->
        <!-- SUBMITTED USER DETAILS -->
        <!-- ================================================= -->

        <div
            id="resultCard"
            class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-10 mt-6">

            <h2 class="text-2xl font-bold text-slate-800 mb-6">

                Submitted Information

            </h2>

            <div id="resultContent"></div>

        </div>



        <!-- ================================================= -->
        <!-- ALL USERS SECTION -->
        <!-- ================================================= -->

        <div
            class="bg-white rounded-2xl shadow-xl p-6 md:p-10 mt-6">


            <!-- HEADING -->

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">

                <div>

                    <h2 class="text-2xl font-bold text-slate-800">

                        All Submitted Users

                    </h2>

                    <p class="text-slate-500 mt-1">

                        Search and open any submitted user's complete information

                    </p>

                </div>


                <!-- TOTAL USERS -->

                <div
                    id="totalUsers"
                    class="bg-indigo-100 text-indigo-700 font-semibold px-4 py-2 rounded-lg">

                    Users: 0

                </div>

            </div>



            <!-- SEARCH -->

            <div class="mb-6">

                <label
                    for="searchUser"
                    class="block text-sm font-semibold text-slate-700 mb-2">

                    Search User

                </label>

                <input
                    type="text"
                    id="searchUser"
                    placeholder="Search by name, email, phone, city, skills, qualification..."
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">

            </div>



            <!-- USERS CONTAINER -->

            <div
                id="usersContainer"
                class="grid grid-cols-1 md:grid-cols-2 gap-5">

            </div>



            <!-- NO USER MESSAGE -->

            <div
                id="noUsersMessage"
                class="hidden text-center py-10 text-slate-500">

                No user found.

            </div>


        </div>


    </div>



    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script src="form.js"></script>

</body>

</html>
